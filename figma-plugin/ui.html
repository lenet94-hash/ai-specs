<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Specs</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #0F1117;
      --surface:    #181C26;
      --border:     #252A36;
      --accent:     #2F8FDE;
      --accent-2:   #3AA9C9;
      --text:       #E2E8F0;
      --text-muted: #6B7280;
      --token:      #3AA9C9;
      --direct:     #6B7280;
      --missing:    #EF4444;
      --row-odd:    #181C26;
      --row-even:   #1C2130;
      --font:       -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 12px;
      line-height: 1.5;
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 16px 10px;
      border-bottom: 1px solid var(--border);
    }

    .logo-mark {
      width: 22px;
      height: 22px;
      border-radius: 5px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.5px;
      flex-shrink: 0;
    }

    .plugin-name {
      font-size: 13px;
      font-weight: 600;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* ── Node info ── */
    #node-info {
      padding: 8px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: baseline;
      gap: 6px;
    }

    .node-name {
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 440px;
    }

    .node-type {
      font-size: 10px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      flex-shrink: 0;
    }

    /* ── States ── */
    #state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 40px 24px;
      color: var(--text-muted);
      text-align: center;
    }

    .state-icon { font-size: 28px; }
    .state-title { font-size: 13px; font-weight: 500; color: var(--text); }
    .state-hint  { font-size: 11px; color: var(--text-muted); }

    /* ── Table (single spec) ── */
    #table-wrap {
      overflow-x: hidden;
      padding: 8px 0;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    col.col-prop  { width: 34%; }
    col.col-val   { width: 36%; }
    col.col-src   { width: 30%; }

    thead th {
      padding: 4px 16px;
      text-align: left;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      background: var(--bg);
    }

    tbody tr:nth-child(odd)  { background: var(--row-odd); }
    tbody tr:nth-child(even) { background: var(--row-even); }

    tbody td {
      padding: 5px 16px;
      vertical-align: middle;
      word-break: break-word;
    }

    td.prop-label {
      color: var(--text-muted);
      font-size: 11px;
    }

    td.prop-value {
      color: var(--text);
      font-size: 11px;
      font-family: "SF Mono", "Fira Code", "Consolas", monospace;
    }

    td.prop-value.missing { color: var(--missing); font-style: italic; }

    td.prop-source { font-size: 10px; }

    .badge {
      display: inline-flex;
      align-items: flex-start;
      gap: 3px;
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 500;
      white-space: normal;
      word-break: break-all;
    }

    .badge-token {
      background: rgba(58, 169, 201, 0.12);
      color: var(--token);
      border: 1px solid rgba(58, 169, 201, 0.2);
    }

    .badge-direct {
      background: rgba(107, 114, 128, 0.12);
      color: var(--direct);
      border: 1px solid rgba(107, 114, 128, 0.2);
    }

    .badge-auto {
      background: rgba(47, 143, 222, 0.10);
      color: var(--accent);
      border: 1px solid rgba(47, 143, 222, 0.2);
    }

    .badge-warn {
      background: rgba(239, 68, 68, 0.10);
      color: var(--missing);
      border: 1px solid rgba(239, 68, 68, 0.2);
    }

    /* ── Token name ── */
    .token-name {
      font-size: 9px;
      color: var(--token);
      opacity: 0.75;
      display: block;
      margin-top: 1px;
      font-family: "SF Mono", monospace;
    }

    /* ── Footer / Actions ── */
    footer {
      padding: 10px 16px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: 6px;
      font-family: var(--font);
      font-size: 11px;
      font-weight: 500;
      padding: 6px 14px;
      transition: opacity 0.15s;
    }

    button:hover  { opacity: 0.85; }
    button:active { opacity: 0.7; }

    #copy-btn {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff;
    }

    #copy-btn:disabled {
      background: var(--border);
      color: var(--text-muted);
      cursor: default;
      opacity: 1;
    }

    .copy-ok {
      font-size: 10px;
      color: var(--token);
      margin-right: 8px;
      align-self: center;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .copy-ok.show { opacity: 1; }

    /* ── Error ── */
    #error-box {
      display: none;
      margin: 12px 16px;
      padding: 8px 12px;
      border-radius: 6px;
      background: rgba(239, 68, 68, 0.08);
      border: 1px solid rgba(239, 68, 68, 0.25);
      color: var(--missing);
      font-size: 11px;
    }

    /* ── Multi-component accordion ── */
    #multi-wrap {
      display: none;
      padding: 0 0 8px;
    }

    .accordion-item { border-bottom: 1px solid var(--border); }

    .accordion-header {
      display: flex; align-items: center; gap: 6px;
      padding: 8px 16px; cursor: pointer; user-select: none;
      background: var(--surface); transition: background 0.15s;
    }
    .accordion-header:hover { background: var(--row-even); }

    .accordion-chevron {
      font-size: 10px; color: var(--text-muted);
      transition: transform 0.2s; flex-shrink: 0;
    }
    .accordion-item.open .accordion-chevron { transform: rotate(90deg); }

    .accordion-comp-name {
      font-size: 12px; font-weight: 600; color: var(--text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .accordion-comp-type {
      font-size: 10px; color: var(--text-muted);
      text-transform: uppercase; letter-spacing: 0.5px; flex-shrink: 0;
    }

    .accordion-body { display: none; overflow-x: hidden; }
    .accordion-item.open .accordion-body { display: block; }

    .multi-counter {
      font-size: 10px; color: var(--text-muted); padding: 4px 16px 2px;
    }

    /* ── Variant comparison table ── */
    #variant-wrap { display: none; overflow-x: auto; padding: 8px 0; }

    .variant-info {
      font-size: 10px; color: var(--text-muted); padding: 4px 16px 6px;
    }
    .variant-info .variant-warn {
      color: var(--accent-2); font-style: italic;
    }

    .variant-fixed-props {
      display: flex; flex-wrap: wrap; gap: 4px; padding: 2px 16px 8px;
    }
    .variant-fixed-props .badge {
      font-size: 10px;
      background: rgba(47, 143, 222, 0.08);
      color: var(--accent);
      border: 1px solid rgba(47, 143, 222, 0.18);
    }

    #variant-wrap table { width: 100%; border-collapse: collapse; }

    #variant-wrap thead th {
      padding: 4px 10px; text-align: left;
      font-size: 10px; font-weight: 600; letter-spacing: 0.5px;
      text-transform: uppercase; color: var(--text-muted);
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0; background: var(--bg); white-space: nowrap;
    }
    #variant-wrap thead th:first-child { padding-left: 16px; }

    #variant-wrap tbody tr:nth-child(odd)  { background: var(--row-odd); }
    #variant-wrap tbody tr:nth-child(even) { background: var(--row-even); }

    #variant-wrap tbody td {
      padding: 4px 10px; vertical-align: middle; word-break: break-word;
      font-size: 11px;
      font-family: "SF Mono", "Fira Code", "Consolas", monospace;
      color: var(--text);
    }
    #variant-wrap tbody td:first-child {
      padding-left: 16px; font-family: var(--font);
      color: var(--text-muted); font-size: 11px;
    }
    #variant-wrap tbody td.missing { color: var(--missing); font-style: italic; }

    #variant-wrap tbody tr.diff td { background: rgba(47, 143, 222, 0.06); }
    #variant-wrap tbody tr.diff td:first-child::before {
      content: "\25C6 "; color: var(--accent); font-size: 9px;
    }

    /* ── AI Documentation ── */
    #ai-doc-wrap {
      border-top: 1px solid var(--border);
      padding: 10px 16px 12px;
    }

    .ai-doc-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 8px;
    }
    .ai-doc-header-title {
      font-size: 10px; font-weight: 600; letter-spacing: 0.6px;
      text-transform: uppercase; color: var(--text-muted);
    }
    .ai-doc-badge {
      font-size: 9px; padding: 1px 6px; border-radius: 4px;
      background: rgba(47, 143, 222, 0.1); color: var(--accent);
      border: 1px solid rgba(47, 143, 222, 0.2);
    }

    .ai-doc-sections { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    .ai-doc-section {}
    .ai-doc-title {
      font-size: 10px; font-weight: 600; color: var(--accent-2);
      margin-bottom: 4px; letter-spacing: 0.3px;
    }
    .ai-doc-list { list-style: none; padding: 0; margin: 0; }
    .ai-doc-list li {
      padding: 2px 0 2px 10px; font-size: 11px;
      color: var(--text); line-height: 1.4; position: relative;
    }
    .ai-doc-list li::before {
      content: '—'; position: absolute; left: 0; color: var(--text-muted);
    }

    .ai-doc-error { color: var(--missing); font-size: 11px; padding: 4px 0; }

    /* ── Generate button ── */
    #gen-btn {
      background: rgba(47, 143, 222, 0.1);
      color: var(--accent);
      border: 1px solid rgba(47, 143, 222, 0.25);
    }
    #gen-btn:disabled {
      background: var(--border); color: var(--text-muted);
      cursor: default; opacity: 1; border: none;
    }
    #gen-btn.loading { opacity: 0.6; cursor: default; }
  </style>
</head>
<body>

<header>
  <div class="logo-mark">AI</div>
  <span class="plugin-name">AI Specs</span>
</header>

<div id="node-info" style="display:none;">
  <span class="node-name" id="node-name-text"></span>
  <span class="node-type"  id="node-type-text"></span>
</div>

<div id="state">
  <div class="state-icon">↖</div>
  <div class="state-title">Виберіть елемент</div>
  <div class="state-hint">Клацніть на будь-який шар у Figma, щоб побачити специфікацію</div>
</div>

<div id="error-box"></div>

<div id="table-wrap" style="display:none;">
  <table>
    <colgroup>
      <col class="col-prop">
      <col class="col-val">
      <col class="col-src">
    </colgroup>
    <thead>
      <tr>
        <th>Властивість</th>
        <th>Значення</th>
        <th>Джерело</th>
      </tr>
    </thead>
    <tbody id="spec-body"></tbody>
  </table>
</div>

<div id="variant-wrap">
  <div class="variant-info" id="variant-info"></div>
  <div class="variant-fixed-props" id="variant-fixed-props"></div>
  <div id="variant-table-container"></div>
</div>

<div id="multi-wrap">
  <div class="multi-counter" id="multi-counter"></div>
  <div id="accordion-container"></div>
</div>

<div id="ai-doc-wrap" style="display:none;"></div>

<footer>
  <button id="gen-btn" disabled>✦ Generate Doc</button>
  <span style="flex:1"></span>
  <span class="copy-ok" id="copy-ok-msg">Скопійовано!</span>
  <button id="copy-btn" disabled>Скопіювати як Markdown</button>
</footer>

<script>
  // ─── State ───────────────────────────────────────────────────────────────

  let currentMode = null; // 'single' | 'multi' | 'variant'
  let currentFields = null;
  let currentComponents = null;
  let currentVariantData = null;
  let currentAiDoc = null;

  const state      = document.getElementById('state');
  const nodeInfo   = document.getElementById('node-info');
  const nodeNameEl = document.getElementById('node-name-text');
  const nodeTypeEl = document.getElementById('node-type-text');
  const tableWrap  = document.getElementById('table-wrap');
  const specBody   = document.getElementById('spec-body');
  const copyBtn    = document.getElementById('copy-btn');
  const copyOkMsg  = document.getElementById('copy-ok-msg');
  const errorBox   = document.getElementById('error-box');
  const multiWrap  = document.getElementById('multi-wrap');
  const multiCounter = document.getElementById('multi-counter');
  const accordionContainer = document.getElementById('accordion-container');
  const variantWrap = document.getElementById('variant-wrap');
  const variantInfo = document.getElementById('variant-info');
  const variantFixedProps = document.getElementById('variant-fixed-props');
  const variantTableContainer = document.getElementById('variant-table-container');
  const aiDocWrap  = document.getElementById('ai-doc-wrap');
  const genBtn     = document.getElementById('gen-btn');

  function hideAll() {
    state.style.display       = 'none';
    tableWrap.style.display   = 'none';
    multiWrap.style.display   = 'none';
    variantWrap.style.display = 'none';
    aiDocWrap.style.display   = 'none';
    nodeInfo.style.display    = 'none';
    errorBox.style.display    = 'none';
    currentMode = null;
    currentFields = null;
    currentComponents = null;
    currentVariantData = null;
    currentAiDoc = null;
  }

  // ─── Source → badge ──────────────────────────────────────────────────────

  function sourceBadge(source) {
    if (!source) return '<span class="badge badge-direct">—</span>';
    if (source.startsWith('токен:')) {
      const name = source.replace('токен:', '').trim();
      return '<span class="badge badge-token">◈ <span class="token-name" title="' + name + '">' + name + '</span></span>';
    }
    if (source === 'токен використано, деталі отримати не вдалося')
      return '<span class="badge badge-warn">⚠ токен</span>';
    if (source === 'розраховується автоматично')
      return '<span class="badge badge-auto">⚡ auto</span>';
    return '<span class="badge badge-direct">пряме</span>';
  }

  // ─── Render single spec ────────────────────────────────────────────────

  function renderSpec(nodeName, nodeType, fields) {
    hideAll();
    currentMode = 'single';
    currentFields = fields;

    nodeNameEl.textContent = nodeName;
    nodeTypeEl.textContent = nodeType;
    nodeInfo.style.display  = 'flex';
    tableWrap.style.display = 'block';
    copyBtn.disabled        = false;
    genBtn.disabled         = false;

    specBody.innerHTML = fields.map(function(f) {
      var cls = f.value === 'не знайдено' ? 'prop-value missing' : 'prop-value';
      return '<tr><td class="prop-label">' + f.label + '</td>'
        + '<td class="' + cls + '">' + f.value + '</td>'
        + '<td class="prop-source">' + sourceBadge(f.source) + '</td></tr>';
    }).join('');
  }

  // ─── Render multi-component accordion ──────────────────────────────────

  function renderFieldsTable(fields) {
    var rows = fields.map(function(f) {
      var cls = f.value === 'не знайдено' ? 'prop-value missing' : 'prop-value';
      return '<tr><td class="prop-label">' + f.label + '</td>'
        + '<td class="' + cls + '">' + f.value + '</td>'
        + '<td class="prop-source">' + sourceBadge(f.source) + '</td></tr>';
    }).join('');
    return '<table><colgroup><col class="col-prop"><col class="col-val"><col class="col-src"></colgroup>'
      + '<thead><tr><th>Властивість</th><th>Значення</th><th>Джерело</th></tr></thead>'
      + '<tbody>' + rows + '</tbody></table>';
  }

  function renderMultiSpec(containerName, containerType, components) {
    hideAll();
    currentMode = 'multi';
    currentComponents = components;

    nodeNameEl.textContent = containerName;
    nodeTypeEl.textContent = containerType;
    nodeInfo.style.display  = 'flex';
    multiWrap.style.display = 'block';
    copyBtn.disabled        = false;

    multiCounter.textContent = 'Знайдено компонентів: ' + components.length;

    accordionContainer.innerHTML = components.map(function(comp, i) {
      return '<div class="accordion-item' + (i === 0 ? ' open' : '') + '">'
        + '<div class="accordion-header" data-index="' + i + '">'
        + '<span class="accordion-chevron">▶</span>'
        + '<span class="accordion-comp-name">' + comp.nodeName + '</span>'
        + '<span class="accordion-comp-type">' + comp.nodeType + '</span>'
        + '</div><div class="accordion-body">' + renderFieldsTable(comp.fields) + '</div></div>';
    }).join('');

    accordionContainer.querySelectorAll('.accordion-header').forEach(function(header) {
      header.addEventListener('click', function() {
        header.parentElement.classList.toggle('open');
      });
    });
  }

  // ─── Render variant comparison ─────────────────────────────────────────

  function renderVariantComparison(data) {
    hideAll();
    currentMode = 'variant';
    currentVariantData = data;

    var variants = data.variants;
    var fixedProps = data.fixedProps;

    nodeNameEl.textContent = data.componentSetName;
    nodeTypeEl.textContent = 'COMPONENT_SET';
    nodeInfo.style.display    = 'flex';
    variantWrap.style.display = 'block';
    copyBtn.disabled          = false;
    genBtn.disabled           = false;

    if (!data.hasStateProperty) {
      variantInfo.innerHTML = '<span class="variant-warn">Показано всі variants — властивість стану не визначена</span>';
    } else {
      variantInfo.textContent = 'Порівняння станів (' + variants.length + ')';
    }

    var fixedEntries = Object.entries(fixedProps);
    if (fixedEntries.length > 0) {
      variantFixedProps.style.display = 'flex';
      variantFixedProps.innerHTML = fixedEntries.map(function(e) {
        return '<span class="badge">' + e[0] + ': ' + e[1] + '</span>';
      }).join('');
    } else {
      variantFixedProps.style.display = 'none';
    }

    // Collect all unique property labels
    var allLabels = [];
    var labelSet = {};
    variants.forEach(function(v) {
      v.fields.forEach(function(f) {
        if (!labelSet[f.label]) { labelSet[f.label] = true; allLabels.push(f.label); }
      });
    });

    var stateLabels = variants.map(function(v) { return v.stateLabel; });
    var fieldMaps = variants.map(function(v) {
      var m = {};
      v.fields.forEach(function(f) { m[f.label] = { value: f.value, source: f.source }; });
      return m;
    });

    function rowHasDiff(label) {
      var first = fieldMaps[0][label] ? fieldMaps[0][label].value : '—';
      for (var i = 1; i < fieldMaps.length; i++) {
        var val = fieldMaps[i][label] ? fieldMaps[i][label].value : '—';
        if (val !== first) return true;
      }
      return false;
    }

    function cellHtml(field) {
      if (!field) return '<td class="missing">—</td>';
      var val = field.value;
      var cls = val === 'не знайдено' ? ' class="missing"' : '';
      var src = field.source || '';
      if (src.startsWith('токен:')) {
        var name = src.replace('токен:', '').trim();
        return '<td' + cls + '>'
          + '<span style="color:var(--text);font-weight:500;">' + name + '</span>'
          + '<span class="token-name" style="display:block;margin-top:1px;opacity:0.5;">' + val + '</span>'
          + '</td>';
      }
      return '<td' + cls + '>' + val + '</td>';
    }

    var headerCols = stateLabels.map(function(s) { return '<th>' + s + '</th>'; }).join('');
    var bodyRows = allLabels.map(function(label) {
      var isDiff = rowHasDiff(label);
      var cells = fieldMaps.map(function(m) { return cellHtml(m[label]); }).join('');
      return '<tr class="' + (isDiff ? 'diff' : '') + '"><td>' + label + '</td>' + cells + '</tr>';
    }).join('');

    variantTableContainer.innerHTML = '<table><thead><tr><th>Властивість</th>'
      + headerCols + '</tr></thead><tbody>' + bodyRows + '</tbody></table>';
  }

  // ─── Show state messages ─────────────────────────────────────────────────

  function showState(icon, title, hint) {
    hideAll();
    state.innerHTML = '<div class="state-icon">' + icon + '</div>'
      + '<div class="state-title">' + title + '</div>'
      + '<div class="state-hint">' + hint + '</div>';
    state.style.display = 'flex';
    copyBtn.disabled = true;
  }

  function showError(msg) {
    hideAll();
    state.innerHTML = '<div class="state-icon">⚠</div>'
      + '<div class="state-title" style="color:var(--accent-2)">Не вдалося зчитати елемент</div>'
      + '<div class="state-hint">' + msg + '</div>';
    state.style.display = 'flex';
    copyBtn.disabled = true;
  }

  // ─── Message handler ─────────────────────────────────────────────────────

  window.onmessage = function(event) {
    var msg = event.data.pluginMessage;
    if (!msg) return;

    switch (msg.type) {
      case 'spec-data':
        renderSpec(msg.payload.nodeName, msg.payload.nodeType, msg.payload.fields);
        break;
      case 'multi-spec-data':
        renderMultiSpec(msg.payload.containerName, msg.payload.containerType, msg.payload.components);
        break;
      case 'variant-comparison-data':
        renderVariantComparison(msg.payload);
        break;
      case 'no-selection':
        showState('↖', 'Виберіть елемент', 'Клацніть на будь-який шар у Figma');
        break;
      case 'multi-selection':
        showState('⊟', 'Кілька елементів', 'Оберіть лише один елемент за раз');
        break;
      case 'no-components-in-frame':
        showState('◇', 'Компоненти не знайдено', 'На цьому фреймі не знайдено компонентів');
        break;
      case 'error':
        showError(msg.message);
        break;
    }
  };

  // ─── Copy as Markdown ────────────────────────────────────────────────────

  function fieldsToMarkdownTable(fields) {
    var header = '| Властивість | Значення | Джерело |';
    var sep    = '|-------------|----------|---------|';
    var rows   = fields.map(function(f) {
      var srcText = f.source || '—';
      if (srcText.startsWith('токен:')) srcText = '`' + srcText.replace('токен:', '').trim() + '`';
      return '| ' + f.label + ' | ' + f.value + ' | ' + srcText + ' |';
    });
    return [header, sep].concat(rows).join('\n');
  }

  function variantToMarkdown(data) {
    var lines = ['## ' + data.componentSetName];
    var fixedEntries = Object.entries(data.fixedProps);
    if (fixedEntries.length > 0) {
      lines.push('');
      lines.push(fixedEntries.map(function(e) { return '**' + e[0] + '**: ' + e[1]; }).join(' | '));
    }
    if (!data.hasStateProperty) {
      lines.push('');
      lines.push('> _Показано всі variants — властивість стану не визначена_');
    }

    var allLabels = []; var labelSet = {};
    data.variants.forEach(function(v) {
      v.fields.forEach(function(f) {
        if (!labelSet[f.label]) { labelSet[f.label] = true; allLabels.push(f.label); }
      });
    });

    var stateLabels = data.variants.map(function(v) { return v.stateLabel; });
    var fMaps = data.variants.map(function(v) {
      var m = {};
      v.fields.forEach(function(f) { m[f.label] = { value: f.value, source: f.source }; });
      return m;
    });

    lines.push('');
    lines.push('| Властивість | ' + stateLabels.join(' | ') + ' |');
    lines.push('|---' + stateLabels.map(function() { return '|---'; }).join('') + '|');

    allLabels.forEach(function(label) {
      var vals = fMaps.map(function(m) {
        if (!m[label]) return '—';
        var v = m[label].value;
        var s = m[label].source || '';
        if (s.startsWith('токен:')) return v + ' (`' + s.replace('токен:', '').trim() + '`)';
        return v;
      });
      var rawVals = fMaps.map(function(m) { return m[label] ? m[label].value : '—'; });
      var isDiff = rawVals.some(function(v) { return v !== rawVals[0]; });
      var pre = isDiff ? '**' : '';
      var suf = isDiff ? '**' : '';
      lines.push('| ' + pre + label + suf + ' | ' + vals.join(' | ') + ' |');
    });

    return lines.join('\n');
  }

  // ─── AI Doc render ───────────────────────────────────────────────────────

  var AI_SECTIONS = [
    { key: 'usageGuidelines',  title: 'Usage Guidelines' },
    { key: 'contentGuidelines', title: 'Content Guidelines' },
    { key: 'behavior',         title: 'Behavior' },
    { key: 'edgeCases',        title: 'Edge Cases' },
  ];

  function renderAiDoc(data) {
    var sectionsHtml = AI_SECTIONS.map(function(s) {
      var items = (data[s.key] || []).map(function(item) {
        return '<li>' + item + '</li>';
      }).join('');
      return '<div class="ai-doc-section">'
        + '<div class="ai-doc-title">' + s.title + '</div>'
        + '<ul class="ai-doc-list">' + items + '</ul>'
        + '</div>';
    }).join('');

    aiDocWrap.innerHTML = '<div class="ai-doc-header">'
      + '<span class="ai-doc-header-title">AI Documentation</span>'
      + '<span class="ai-doc-badge">✦ Claude</span>'
      + '</div>'
      + '<div class="ai-doc-sections">' + sectionsHtml + '</div>';
    aiDocWrap.style.display = 'block';
  }

  // ─── Generate Doc button ─────────────────────────────────────────────────

  genBtn.addEventListener('click', async function() {
    if (genBtn.disabled || genBtn.classList.contains('loading')) return;

    var componentName = nodeNameEl.textContent;
    var componentType = nodeTypeEl.textContent;
    var props = {};

    if (currentMode === 'single' && currentFields) {
      currentFields.forEach(function(f) { props[f.label] = f.value; });
    } else if (currentMode === 'variant' && currentVariantData && currentVariantData.variants.length > 0) {
      currentVariantData.variants[0].fields.forEach(function(f) { props[f.label] = f.value; });
      componentName = currentVariantData.componentSetName;
      componentType = 'COMPONENT_SET';
    } else {
      return;
    }

    genBtn.classList.add('loading');
    genBtn.disabled = true;
    genBtn.textContent = 'Генерується…';
    aiDocWrap.style.display = 'none';

    try {
      var res = await fetch('https://ai-specs.vercel.app/api/generate-spec', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ componentName: componentName, componentType: componentType, properties: props }),
      });

      if (!res.ok) {
        var errData = await res.json().catch(function() { return {}; });
        throw new Error(errData.error || ('HTTP ' + res.status));
      }

      var data = await res.json();
      currentAiDoc = data;
      renderAiDoc(data);
    } catch (e) {
      aiDocWrap.innerHTML = '<div class="ai-doc-error">⚠ ' + (e.message || 'Помилка генерації') + '</div>';
      aiDocWrap.style.display = 'block';
    }

    genBtn.classList.remove('loading');
    genBtn.disabled = false;
    genBtn.textContent = '✦ Generate Doc';
  });

  // ─── Copy as Markdown ────────────────────────────────────────────────────

  function aiDocToMarkdown(data) {
    return AI_SECTIONS.map(function(s) {
      var items = (data[s.key] || []).map(function(i) { return '- ' + i; }).join('\n');
      return '### ' + s.title + '\n' + items;
    }).join('\n\n');
  }

  copyBtn.addEventListener('click', async function() {
    var md;

    if (currentMode === 'variant' && currentVariantData) {
      md = variantToMarkdown(currentVariantData);
    } else if (currentMode === 'multi' && currentComponents) {
      md = currentComponents.map(function(comp) {
        return '## ' + comp.nodeName + '\n\n' + fieldsToMarkdownTable(comp.fields);
      }).join('\n\n');
    } else if (currentMode === 'single' && currentFields) {
      md = fieldsToMarkdownTable(currentFields);
    } else {
      return;
    }

    if (currentAiDoc) {
      md += '\n\n' + aiDocToMarkdown(currentAiDoc);
    }

    try {
      await navigator.clipboard.writeText(md);
      copyOkMsg.classList.add('show');
      setTimeout(function() { copyOkMsg.classList.remove('show'); }, 2000);
    } catch (e) {
      var ta = document.createElement('textarea');
      ta.value = md;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      copyOkMsg.classList.add('show');
      setTimeout(function() { copyOkMsg.classList.remove('show'); }, 2000);
    }
  });
</script>
</body>
