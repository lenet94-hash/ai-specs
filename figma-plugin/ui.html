<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Specs</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #0F1117;
      --surface:    #181C26;
      --border:     #252A36;
      --accent:     #2F8FDE;
      --accent-2:   #3AA9C9;
      --text:       #E2E8F0;
      --text-muted: #6B7280;
      --token:      #3AA9C9;
      --direct:     #6B7280;
      --missing:    #EF4444;
      --row-odd:    #181C26;
      --row-even:   #1C2130;
      --font:       -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 12px;
      line-height: 1.5;
      min-height: 100vh;
    }

    /* ── Layout: scrollable body + sticky footer ── */
    body {
      display: flex;
      flex-direction: column;
    }

    #main-content {
      flex: 1;
      overflow-y: auto;
      min-height: 0;
    }

    /* ── Node info ── */
    #node-info {
      padding: 8px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: baseline;
      gap: 6px;
    }

    .node-name {
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 440px;
    }

    .node-type {
      font-size: 10px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      flex-shrink: 0;
    }

    /* ── States ── */
    #state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 40px 24px;
      color: var(--text-muted);
      text-align: center;
    }

    .state-icon { font-size: 28px; }
    .state-title { font-size: 13px; font-weight: 500; color: var(--text); }
    .state-hint  { font-size: 11px; color: var(--text-muted); }

    /* ── Table (single spec) ── */
    #table-wrap {
      overflow-x: hidden;
      padding: 8px 0;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    col.col-prop  { width: 34%; }
    col.col-val   { width: 36%; }
    col.col-src   { width: 30%; }

    thead th {
      padding: 4px 16px;
      text-align: left;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      background: var(--bg);
    }

    tbody tr:nth-child(odd)  { background: var(--row-odd); }
    tbody tr:nth-child(even) { background: var(--row-even); }

    tbody td {
      padding: 5px 16px;
      vertical-align: middle;
      word-break: break-word;
    }

    td.prop-label {
      color: var(--text-muted);
      font-size: 11px;
    }

    td.prop-value {
      color: var(--text);
      font-size: 11px;
      font-family: "SF Mono", "Fira Code", "Consolas", monospace;
    }

    td.prop-value.missing { color: var(--missing); font-style: italic; }

    td.prop-source { font-size: 10px; }

    .badge {
      display: inline-flex;
      align-items: flex-start;
      gap: 3px;
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 500;
      white-space: normal;
      word-break: break-all;
    }

    .badge-token {
      background: rgba(58, 169, 201, 0.12);
      color: var(--token);
      border: 1px solid rgba(58, 169, 201, 0.2);
    }

    .badge-direct {
      background: rgba(107, 114, 128, 0.12);
      color: var(--direct);
      border: 1px solid rgba(107, 114, 128, 0.2);
    }

    .badge-auto {
      background: rgba(47, 143, 222, 0.10);
      color: var(--accent);
      border: 1px solid rgba(47, 143, 222, 0.2);
    }

    .badge-warn {
      background: rgba(239, 68, 68, 0.10);
      color: var(--missing);
      border: 1px solid rgba(239, 68, 68, 0.2);
    }

    /* ── Token name ── */
    .token-name {
      font-size: 9px;
      color: var(--token);
      opacity: 0.75;
      display: block;
      margin-top: 1px;
      font-family: "SF Mono", monospace;
    }

    /* ── Footer / Actions — sticky at bottom ── */
    footer {
      padding: 10px 16px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg);
      flex-shrink: 0;
    }

    /* ── Back button ── */
    #back-btn {
      background: none;
      color: var(--text-muted);
      padding: 4px 8px;
      font-size: 11px;
      border: 1px solid var(--border);
      border-radius: 4px;
      cursor: pointer;
      flex-shrink: 0;
    }
    #back-btn:hover { color: var(--text); border-color: var(--text-muted); }

    button {
      cursor: pointer;
      border: none;
      border-radius: 6px;
      font-family: var(--font);
      font-size: 11px;
      font-weight: 500;
      padding: 6px 14px;
      transition: opacity 0.15s;
    }

    button:hover  { opacity: 0.85; }
    button:active { opacity: 0.7; }

    #copy-btn {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff;
    }

    #copy-btn:disabled {
      background: var(--border);
      color: var(--text-muted);
      cursor: default;
      opacity: 1;
    }

    .copy-ok {
      font-size: 10px;
      color: var(--token);
      margin-right: 8px;
      align-self: center;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .copy-ok.show { opacity: 1; }

    /* ── Error ── */
    #error-box {
      display: none;
      margin: 12px 16px;
      padding: 8px 12px;
      border-radius: 6px;
      background: rgba(239, 68, 68, 0.08);
      border: 1px solid rgba(239, 68, 68, 0.25);
      color: var(--missing);
      font-size: 11px;
    }

    /* ── Multi-component accordion ── */
    #multi-wrap {
      display: none;
      padding: 0 0 8px;
    }

    .accordion-item { border-bottom: 1px solid var(--border); }

    .accordion-header {
      display: flex; align-items: center; gap: 6px;
      padding: 8px 16px; cursor: pointer; user-select: none;
      background: var(--surface); transition: background 0.15s;
    }
    .accordion-header:hover { background: var(--row-even); }

    .accordion-chevron {
      font-size: 10px; color: var(--text-muted);
      transition: transform 0.2s; flex-shrink: 0;
    }
    .accordion-item.open .accordion-chevron { transform: rotate(90deg); }

    .accordion-comp-name {
      font-size: 12px; font-weight: 600; color: var(--text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .accordion-comp-type {
      font-size: 10px; color: var(--text-muted);
      text-transform: uppercase; letter-spacing: 0.5px; flex-shrink: 0;
    }

    .accordion-body { display: none; overflow-x: hidden; }
    .accordion-item.open .accordion-body { display: block; }

    .multi-counter {
      font-size: 10px; color: var(--text-muted); padding: 4px 16px 2px;
    }

    /* ── Variant comparison table ── */
    #variant-wrap { display: none; overflow-x: auto; padding: 8px 0; }

    .variant-info {
      font-size: 10px; color: var(--text-muted); padding: 4px 16px 6px;
    }
    .variant-info .variant-warn {
      color: var(--accent-2); font-style: italic;
    }

    .variant-fixed-props {
      display: flex; flex-wrap: wrap; gap: 4px; padding: 2px 16px 8px;
    }
    .variant-fixed-props .badge {
      font-size: 10px;
      background: rgba(47, 143, 222, 0.08);
      color: var(--accent);
      border: 1px solid rgba(47, 143, 222, 0.18);
    }

    #variant-wrap table { width: 100%; border-collapse: collapse; }

    #variant-wrap thead th {
      padding: 4px 10px; text-align: left;
      font-size: 10px; font-weight: 600; letter-spacing: 0.5px;
      text-transform: uppercase; color: var(--text-muted);
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0; background: var(--bg); white-space: nowrap;
    }
    #variant-wrap thead th:first-child { padding-left: 16px; }

    #variant-wrap tbody tr:nth-child(odd)  { background: var(--row-odd); }
    #variant-wrap tbody tr:nth-child(even) { background: var(--row-even); }

    #variant-wrap tbody td {
      padding: 4px 10px; vertical-align: middle; word-break: break-word;
      font-size: 11px;
      font-family: "SF Mono", "Fira Code", "Consolas", monospace;
      color: var(--text);
    }
    #variant-wrap tbody td:first-child {
      padding-left: 16px; font-family: var(--font);
      color: var(--text-muted); font-size: 11px;
    }
    #variant-wrap tbody td.missing { color: var(--missing); font-style: italic; }

    #variant-wrap tbody tr.diff td { background: rgba(47, 143, 222, 0.06); }
    #variant-wrap tbody tr.diff td:first-child::before {
      content: "\25C6 "; color: var(--accent); font-size: 9px;
    }

    /* ── AI Documentation ── */
    #ai-doc-wrap {
      border-top: 1px solid var(--border);
      padding: 10px 16px 12px;
    }

    .ai-doc-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 8px;
    }
    .ai-doc-header-title {
      font-size: 10px; font-weight: 600; letter-spacing: 0.6px;
      text-transform: uppercase; color: var(--text-muted);
    }
    .ai-doc-badge {
      font-size: 9px; padding: 1px 6px; border-radius: 4px;
      background: rgba(47, 143, 222, 0.1); color: var(--accent);
      border: 1px solid rgba(47, 143, 222, 0.2);
    }

    .ai-doc-sections { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    .ai-doc-section {}
    .ai-doc-title {
      font-size: 10px; font-weight: 600; color: var(--accent-2);
      margin-bottom: 4px; letter-spacing: 0.3px;
    }
    .ai-doc-list { list-style: none; padding: 0; margin: 0; }
    .ai-doc-list li {
      padding: 2px 0 2px 10px; font-size: 11px;
      color: var(--text); line-height: 1.4; position: relative;
    }
    .ai-doc-list li::before {
      content: '—'; position: absolute; left: 0; color: var(--text-muted);
    }

    .ai-doc-error { color: var(--missing); font-size: 11px; padding: 4px 0; }

    /* ── Generate button ── */
    #gen-btn {
      background: rgba(47, 143, 222, 0.1);
      color: var(--accent);
      border: 1px solid rgba(47, 143, 222, 0.25);
    }
    /* ── Frame scan component list ── */
    #scan-wrap {
      display: none;
      padding: 8px 0;
    }

    .scan-summary {
      font-size: 11px; color: var(--text-muted); padding: 4px 16px 8px;
    }
    .scan-summary strong { color: var(--text); }

    .scan-list {
      list-style: none; padding: 0; margin: 0;
    }
    .scan-item {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 16px; cursor: pointer;
      border-bottom: 1px solid var(--border);
      transition: background 0.15s;
    }
    .scan-item:hover { background: var(--row-even); }

    .scan-item-name {
      font-size: 12px; font-weight: 600; color: var(--text);
      flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .scan-item-count {
      font-size: 10px; color: var(--text-muted);
      background: var(--surface); padding: 2px 8px; border-radius: 10px;
      flex-shrink: 0;
    }
    .scan-item-frames {
      font-size: 10px; color: var(--accent); flex-shrink: 0;
    }
    .scan-item-arrow {
      font-size: 10px; color: var(--text-muted); flex-shrink: 0;
    }

    #gen-btn:disabled {
      background: var(--border); color: var(--text-muted);
      cursor: default; opacity: 1; border: none;
    }
    #gen-btn.loading { opacity: 0.6; cursor: default; }

    /* ── Facts view (multi-selection) ── */
    #facts-wrap {
      display: none;
      padding: 8px 0;
    }

    .facts-summary {
      font-size: 11px; color: var(--text-muted); padding: 4px 16px 8px;
    }
    .facts-summary strong { color: var(--text); }

    .facts-list {
      list-style: none; padding: 0; margin: 0 16px 8px;
    }
    .facts-list li {
      padding: 4px 8px; font-size: 11px; color: var(--text);
      line-height: 1.4; border-left: 2px solid var(--border);
      margin-bottom: 2px;
    }
    .facts-list li[data-category="visual"] { border-left-color: #A78BFA; }
    .facts-list li[data-category="typography"] { border-left-color: #F59E0B; }
    .facts-list li[data-category="spacing"] { border-left-color: #10B981; }
    .facts-list li[data-category="tokens"] { border-left-color: var(--token); }
    .facts-list li[data-category="states"] { border-left-color: #EF4444; }
    .facts-list li[data-category="content"] { border-left-color: #EC4899; }
    .facts-list li[data-category="structure"] { border-left-color: var(--accent); }

    .fact-category {
      font-size: 9px; text-transform: uppercase; letter-spacing: 0.5px;
      color: var(--text-muted); margin-right: 4px;
    }

    /* ── Saved doc banner ── */
    #saved-doc-banner {
      display: none;
      margin: 8px 16px;
      padding: 10px 12px;
      border-radius: 6px;
      background: rgba(47, 143, 222, 0.08);
      border: 1px solid rgba(47, 143, 222, 0.2);
    }
    .saved-doc-title {
      font-size: 11px; font-weight: 600; color: var(--accent);
      margin-bottom: 4px;
    }
    .saved-doc-meta {
      font-size: 10px; color: var(--text-muted); margin-bottom: 8px;
    }
    .saved-doc-actions {
      display: flex; gap: 6px;
    }
    .saved-doc-actions button {
      font-size: 10px; padding: 4px 10px; border-radius: 4px;
    }
    #saved-show-btn {
      background: rgba(47, 143, 222, 0.15); color: var(--accent);
      border: 1px solid rgba(47, 143, 222, 0.3);
    }
    #saved-add-btn {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff;
    }
    #saved-reset-btn {
      background: none; color: var(--text-muted);
      border: 1px solid var(--border);
    }
    /* Saved docs list on empty state */
    #saved-docs-list {
      padding: 0 16px 16px;
    }
    .saved-docs-heading {
      font-size: 11px; font-weight: 600; color: var(--text-muted);
      margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px;
    }
    .saved-doc-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 12px; margin-bottom: 6px;
      background: rgba(47, 143, 222, 0.06);
      border: 1px solid rgba(47, 143, 222, 0.15);
      border-radius: 6px; cursor: pointer;
      transition: background 0.15s;
    }
    .saved-doc-item:hover {
      background: rgba(47, 143, 222, 0.12);
    }
    .saved-doc-item-name {
      font-size: 12px; font-weight: 600; color: var(--text);
    }
    .saved-doc-item-meta {
      font-size: 10px; color: var(--text-muted); margin-top: 2px;
    }
    .saved-doc-item-arrow {
      color: var(--accent); font-size: 12px; flex-shrink: 0; margin-left: 8px;
    }
  </style>
</head>
<body>

<div id="main-content">

<div id="node-info" style="display:none;">
  <button id="back-btn" style="display:none;" title="Назад">← Назад</button>
  <span class="node-name" id="node-name-text"></span>
  <span class="node-type"  id="node-type-text"></span>
</div>

<div id="state">
  <div class="state-icon">↖</div>
  <div class="state-title">Виберіть елемент</div>
  <div class="state-hint">Клацніть на будь-який шар у Figma, щоб побачити специфікацію</div>
</div>

<div id="saved-docs-list" style="display:none"></div>

<div id="error-box"></div>

<div id="table-wrap" style="display:none;">
  <table>
    <colgroup>
      <col class="col-prop">
      <col class="col-val">
      <col class="col-src">
    </colgroup>
    <thead>
      <tr>
        <th>Властивість</th>
        <th>Значення</th>
        <th>Джерело</th>
      </tr>
    </thead>
    <tbody id="spec-body"></tbody>
  </table>
</div>

<div id="variant-wrap">
  <div class="variant-info" id="variant-info"></div>
  <div class="variant-fixed-props" id="variant-fixed-props"></div>
  <div id="variant-table-container"></div>
</div>

<div id="multi-wrap">
  <div class="multi-counter" id="multi-counter"></div>
  <div id="accordion-container"></div>
</div>

<div id="scan-wrap">
  <div class="scan-summary" id="scan-summary"></div>
  <ul class="scan-list" id="scan-list"></ul>
</div>

<div id="saved-doc-banner">
  <div class="saved-doc-title" id="saved-doc-title"></div>
  <div class="saved-doc-meta" id="saved-doc-meta"></div>
  <div class="saved-doc-actions">
    <button id="saved-show-btn">Показати</button>
    <button id="saved-add-btn">+ Додати контекст</button>
    <button id="saved-reset-btn">Скинути</button>
  </div>
</div>

<div id="facts-wrap">
  <div class="facts-summary" id="facts-summary"></div>
  <ul class="facts-list" id="facts-list"></ul>
</div>

<div id="ai-doc-wrap" style="display:none;"></div>

</div><!-- end #main-content -->

<footer>
  <button id="gen-btn" disabled>✦ Generate Doc</button>
  <span style="flex:1"></span>
  <span class="copy-ok" id="copy-ok-msg">Скопійовано!</span>
  <button id="copy-btn" disabled>Скопіювати як Markdown</button>
</footer>

<script>
  // ─── State ───────────────────────────────────────────────────────────────

  let currentMode = null; // 'single' | 'multi' | 'variant' | 'facts' | 'scan'
  let currentFields = null;
  let currentComponents = null;
  let currentVariantData = null;
  let currentAiDoc = null;
  let currentFactsData = null;
  let currentScanData = null;

  const state      = document.getElementById('state');
  const nodeInfo   = document.getElementById('node-info');
  const nodeNameEl = document.getElementById('node-name-text');
  const nodeTypeEl = document.getElementById('node-type-text');
  const tableWrap  = document.getElementById('table-wrap');
  const specBody   = document.getElementById('spec-body');
  const copyBtn    = document.getElementById('copy-btn');
  const copyOkMsg  = document.getElementById('copy-ok-msg');
  const errorBox   = document.getElementById('error-box');
  const multiWrap  = document.getElementById('multi-wrap');
  const multiCounter = document.getElementById('multi-counter');
  const accordionContainer = document.getElementById('accordion-container');
  const variantWrap = document.getElementById('variant-wrap');
  const variantInfo = document.getElementById('variant-info');
  const variantFixedProps = document.getElementById('variant-fixed-props');
  const variantTableContainer = document.getElementById('variant-table-container');
  const aiDocWrap  = document.getElementById('ai-doc-wrap');
  const scanWrap   = document.getElementById('scan-wrap');
  const scanSummary = document.getElementById('scan-summary');
  const scanList   = document.getElementById('scan-list');
  const factsWrap  = document.getElementById('facts-wrap');
  const factsSummary = document.getElementById('facts-summary');
  const factsList  = document.getElementById('facts-list');
  const genBtn     = document.getElementById('gen-btn');
  const backBtn    = document.getElementById('back-btn');
  const savedBanner = document.getElementById('saved-doc-banner');
  const savedMeta  = document.getElementById('saved-doc-meta');
  const savedShowBtn = document.getElementById('saved-show-btn');
  const savedAddBtn = document.getElementById('saved-add-btn');
  const savedResetBtn = document.getElementById('saved-reset-btn');
  const savedDocsList = document.getElementById('saved-docs-list');
  var pendingSavedDoc = null; // holds saved doc while viewing facts
  var pendingDocCheckId = null; // tracks which componentSetId we're checking
  var allSavedDocs = []; // cached list of all saved docs
  var viewingFromSavedList = false; // true when viewing doc from saved list

  function hideAll() {
    state.style.display       = 'none';
    tableWrap.style.display   = 'none';
    multiWrap.style.display   = 'none';
    variantWrap.style.display = 'none';
    scanWrap.style.display    = 'none';
    factsWrap.style.display   = 'none';
    aiDocWrap.style.display   = 'none';
    nodeInfo.style.display    = 'none';
    errorBox.style.display    = 'none';
    backBtn.style.display     = 'none';
    savedBanner.style.display = 'none';
    savedDocsList.style.display = 'none';
    currentMode = null;
    currentFields = null;
    currentComponents = null;
    currentVariantData = null;
    currentAiDoc = null;
    currentFactsData = null;
    currentScanData = null;
    viewingFromSavedList = false;
  }

  // ─── Source → badge ──────────────────────────────────────────────────────

  function sourceBadge(source) {
    if (!source) return '<span class="badge badge-direct">—</span>';
    if (source.startsWith('токен:')) {
      const name = source.replace('токен:', '').trim();
      return '<span class="badge badge-token">◈ <span class="token-name" title="' + name + '">' + name + '</span></span>';
    }
    if (source === 'токен використано, деталі отримати не вдалося')
      return '<span class="badge badge-warn">⚠ токен</span>';
    if (source === 'розраховується автоматично')
      return '<span class="badge badge-auto">⚡ auto</span>';
    return '<span class="badge badge-direct">пряме</span>';
  }

  // ─── Render single spec ────────────────────────────────────────────────

  function renderSpec(nodeName, nodeType, fields) {
    hideAll();
    currentMode = 'single';
    currentFields = fields;

    nodeNameEl.textContent = nodeName;
    nodeTypeEl.textContent = nodeType;
    nodeInfo.style.display  = 'flex';
    tableWrap.style.display = 'block';
    copyBtn.disabled        = false;
    genBtn.disabled         = false;

    specBody.innerHTML = fields.map(function(f) {
      var cls = f.value === 'не знайдено' ? 'prop-value missing' : 'prop-value';
      return '<tr><td class="prop-label">' + f.label + '</td>'
        + '<td class="' + cls + '">' + f.value + '</td>'
        + '<td class="prop-source">' + sourceBadge(f.source) + '</td></tr>';
    }).join('');
  }

  // ─── Render multi-component accordion ──────────────────────────────────

  function renderFieldsTable(fields) {
    var rows = fields.map(function(f) {
      var cls = f.value === 'не знайдено' ? 'prop-value missing' : 'prop-value';
      return '<tr><td class="prop-label">' + f.label + '</td>'
        + '<td class="' + cls + '">' + f.value + '</td>'
        + '<td class="prop-source">' + sourceBadge(f.source) + '</td></tr>';
    }).join('');
    return '<table><colgroup><col class="col-prop"><col class="col-val"><col class="col-src"></colgroup>'
      + '<thead><tr><th>Властивість</th><th>Значення</th><th>Джерело</th></tr></thead>'
      + '<tbody>' + rows + '</tbody></table>';
  }

  function renderMultiSpec(containerName, containerType, components) {
    hideAll();
    currentMode = 'multi';
    currentComponents = components;

    nodeNameEl.textContent = containerName;
    nodeTypeEl.textContent = containerType;
    nodeInfo.style.display  = 'flex';
    multiWrap.style.display = 'block';
    copyBtn.disabled        = false;

    multiCounter.textContent = 'Знайдено компонентів: ' + components.length;

    accordionContainer.innerHTML = components.map(function(comp, i) {
      return '<div class="accordion-item' + (i === 0 ? ' open' : '') + '">'
        + '<div class="accordion-header" data-index="' + i + '">'
        + '<span class="accordion-chevron">▶</span>'
        + '<span class="accordion-comp-name">' + comp.nodeName + '</span>'
        + '<span class="accordion-comp-type">' + comp.nodeType + '</span>'
        + '</div><div class="accordion-body">' + renderFieldsTable(comp.fields) + '</div></div>';
    }).join('');

    accordionContainer.querySelectorAll('.accordion-header').forEach(function(header) {
      header.addEventListener('click', function() {
        header.parentElement.classList.toggle('open');
      });
    });
  }

  // ─── Render variant comparison ─────────────────────────────────────────

  function renderVariantComparison(data) {
    hideAll();
    currentMode = 'variant';
    currentVariantData = data;

    var variants = data.variants;
    var fixedProps = data.fixedProps;

    nodeNameEl.textContent = data.componentSetName;
    nodeTypeEl.textContent = 'COMPONENT_SET';
    nodeInfo.style.display    = 'flex';
    variantWrap.style.display = 'block';
    copyBtn.disabled          = false;
    genBtn.disabled           = false;

    if (!data.hasStateProperty) {
      variantInfo.innerHTML = '<span class="variant-warn">Показано всі variants — властивість стану не визначена</span>';
    } else {
      variantInfo.textContent = 'Порівняння станів (' + variants.length + ')';
    }

    var fixedEntries = Object.entries(fixedProps);
    if (fixedEntries.length > 0) {
      variantFixedProps.style.display = 'flex';
      variantFixedProps.innerHTML = fixedEntries.map(function(e) {
        return '<span class="badge">' + e[0] + ': ' + e[1] + '</span>';
      }).join('');
    } else {
      variantFixedProps.style.display = 'none';
    }

    // Collect all unique property labels
    var allLabels = [];
    var labelSet = {};
    variants.forEach(function(v) {
      v.fields.forEach(function(f) {
        if (!labelSet[f.label]) { labelSet[f.label] = true; allLabels.push(f.label); }
      });
    });

    var stateLabels = variants.map(function(v) { return v.stateLabel; });
    var fieldMaps = variants.map(function(v) {
      var m = {};
      v.fields.forEach(function(f) { m[f.label] = { value: f.value, source: f.source }; });
      return m;
    });

    function rowHasDiff(label) {
      var first = fieldMaps[0][label] ? fieldMaps[0][label].value : '—';
      for (var i = 1; i < fieldMaps.length; i++) {
        var val = fieldMaps[i][label] ? fieldMaps[i][label].value : '—';
        if (val !== first) return true;
      }
      return false;
    }

    function cellHtml(field) {
      if (!field) return '<td class="missing">—</td>';
      var val = field.value;
      var cls = val === 'не знайдено' ? ' class="missing"' : '';
      var src = field.source || '';
      if (src.startsWith('токен:')) {
        var name = src.replace('токен:', '').trim();
        return '<td' + cls + '>'
          + '<span style="color:var(--text);font-weight:500;">' + name + '</span>'
          + '<span class="token-name" style="display:block;margin-top:1px;opacity:0.5;">' + val + '</span>'
          + '</td>';
      }
      return '<td' + cls + '>' + val + '</td>';
    }

    var headerCols = stateLabels.map(function(s) { return '<th>' + s + '</th>'; }).join('');
    var bodyRows = allLabels.map(function(label) {
      var isDiff = rowHasDiff(label);
      var cells = fieldMaps.map(function(m) { return cellHtml(m[label]); }).join('');
      return '<tr class="' + (isDiff ? 'diff' : '') + '"><td>' + label + '</td>' + cells + '</tr>';
    }).join('');

    variantTableContainer.innerHTML = '<table><thead><tr><th>Властивість</th>'
      + headerCols + '</tr></thead><tbody>' + bodyRows + '</tbody></table>';
  }

  // ─── Render frame scan view ──────────────────────────────────────────────

  function renderFrameScan(data) {
    hideAll();
    currentMode = 'scan';
    currentScanData = data;

    nodeNameEl.textContent = data.frameNames.join(' + ');
    nodeTypeEl.textContent = data.totalComponents + ' components';
    nodeInfo.style.display  = 'flex';
    scanWrap.style.display  = 'block';
    copyBtn.disabled        = true;
    genBtn.disabled         = true;

    scanSummary.innerHTML = 'Знайдено <strong>' + data.totalComponents + '</strong> компонентів у фреймах: <strong>' + data.frameNames.join('</strong>, <strong>') + '</strong>';

    scanList.innerHTML = data.groups.map(function(g, i) {
      var frameInfo = g.frameContexts.map(function(fc) {
        return fc.frameName + ' (' + fc.count + ')';
      }).join(', ');
      return '<li class="scan-item" data-index="' + i + '">'
        + '<span class="scan-item-name">' + g.componentSetName + '</span>'
        + '<span class="scan-item-frames">' + frameInfo + '</span>'
        + '<span class="scan-item-count">' + g.instanceCount + ' uses</span>'
        + '<span class="scan-item-arrow">▶</span>'
        + '</li>';
    }).join('');

    scanList.querySelectorAll('.scan-item').forEach(function(item) {
      item.addEventListener('click', function() {
        var idx = parseInt(item.getAttribute('data-index'));
        var group = data.groups[idx];

        // Show loading state
        item.style.opacity = '0.5';
        item.querySelector('.scan-item-arrow').textContent = '⏳';

        // Request facts from plugin code — only for variants used on frames
        parent.postMessage({ pluginMessage: {
          type: 'generate-component-from-scan',
          componentSetId: group.componentSetId,
          usedVariantIds: group.usedVariantIds,
          frameContexts: group.frameContexts,
          variantPropertiesUsed: group.variantPropertiesUsed,
        }}, '*');
      });
    });
  }

  // ─── Render facts view (multi-selection) ─────────────────────────────────

  function renderFacts(data) {
    var savedScan = currentScanData;
    hideAll();
    currentScanData = savedScan; // preserve scan data for back navigation
    currentMode = 'facts';
    currentFactsData = data;

    nodeNameEl.textContent = data.componentName;
    nodeTypeEl.textContent = data.variantCount + ' variants';
    nodeInfo.style.display  = 'flex';
    factsWrap.style.display = 'block';
    genBtn.disabled         = false;
    copyBtn.disabled        = true;

    // Show back button if we came from scan view
    backBtn.style.display = currentScanData ? 'block' : 'none';

    var truncNote = data.variantCount > 10
      ? '<br><span style="color:var(--accent-2)">⚡ Для генерації буде використано перші 10 варіантів</span>'
      : '';
    factsSummary.innerHTML = 'Зібрано <strong>' + data.facts.length + '</strong> фактів з <strong>' + data.variantCount + '</strong> виділених елементів' + truncNote;

    factsList.innerHTML = data.facts.map(function(f) {
      return '<li data-category="' + f.category + '">'
        + '<span class="fact-category">' + f.category + '</span>'
        + f.fact + '</li>';
    }).join('');

    // Check for saved doc
    savedBanner.style.display = 'none';
    pendingSavedDoc = null;
    pendingDocCheckId = data.componentName || null;
    if (data.componentName) {
      parent.postMessage({ pluginMessage: {
        type: 'check-saved-doc',
        componentName: data.componentName,
      }}, '*');
    }
  }

  // ─── Show state messages ─────────────────────────────────────────────────

  function renderSavedDocsList() {
    if (allSavedDocs.length === 0) {
      savedDocsList.style.display = 'none';
      return;
    }
    savedDocsList.innerHTML = '<div class="saved-docs-heading">Збережені документації</div>'
      + allSavedDocs.map(function(doc, i) {
        var date = new Date(doc.generatedAt);
        var timeStr = date.toLocaleString('uk-UA', { hour: '2-digit', minute: '2-digit', day: 'numeric', month: 'short' });
        var frames = doc.frameNames.join(', ');
        return '<div class="saved-doc-item" data-doc-index="' + i + '">'
          + '<div>'
          + '<div class="saved-doc-item-name">' + doc.componentName + '</div>'
          + '<div class="saved-doc-item-meta">' + frames + ' · ' + timeStr + '</div>'
          + '</div>'
          + '<span class="saved-doc-item-arrow">▶</span>'
          + '</div>';
      }).join('');
    savedDocsList.style.display = 'block';

    savedDocsList.querySelectorAll('.saved-doc-item').forEach(function(item) {
      item.addEventListener('click', function() {
        var idx = parseInt(item.getAttribute('data-doc-index'));
        var doc = allSavedDocs[idx];
        if (doc && doc.doc) {
          hideAll();
          currentAiDoc = doc.doc;
          viewingFromSavedList = true;
          renderAiDoc(doc.doc);
          nodeNameEl.textContent = doc.componentName;
          nodeTypeEl.textContent = doc.frameNames.join(', ');
          nodeInfo.style.display = 'flex';
          backBtn.style.display = 'block';
          copyBtn.disabled = false;
        }
      });
    });
  }

  function showState(icon, title, hint) {
    hideAll();
    state.innerHTML = '<div class="state-icon">' + icon + '</div>'
      + '<div class="state-title">' + title + '</div>'
      + '<div class="state-hint">' + hint + '</div>';
    state.style.display = 'flex';
    copyBtn.disabled = true;
    // Show saved docs list if available
    renderSavedDocsList();
  }

  function showError(msg) {
    hideAll();
    state.innerHTML = '<div class="state-icon">⚠</div>'
      + '<div class="state-title" style="color:var(--accent-2)">Не вдалося зчитати елемент</div>'
      + '<div class="state-hint">' + msg + '</div>';
    state.style.display = 'flex';
    copyBtn.disabled = true;
  }

  // ─── Message handler ─────────────────────────────────────────────────────

  window.onmessage = function(event) {
    var msg = event.data.pluginMessage;
    if (!msg) return;

    switch (msg.type) {
      case 'spec-data':
        renderSpec(msg.payload.nodeName, msg.payload.nodeType, msg.payload.fields);
        break;
      case 'multi-spec-data':
        renderMultiSpec(msg.payload.containerName, msg.payload.containerType, msg.payload.components);
        break;
      case 'variant-comparison-data':
        renderVariantComparison(msg.payload);
        break;
      case 'component-facts-data':
        renderFacts(msg.payload);
        break;
      case 'frame-scan-data':
        renderFrameScan(msg.payload);
        break;
      case 'saved-doc-result':
        // Check facts view is visible and response matches our pending request
        if (msg.payload && factsWrap.style.display !== 'none' && pendingDocCheckId) {
          pendingSavedDoc = msg.payload;
          pendingDocCheckId = null;
          var frameList = msg.payload.frameNames.join(', ');
          var date = new Date(msg.payload.generatedAt);
          var timeStr = date.toLocaleString('uk-UA', { hour: '2-digit', minute: '2-digit', day: 'numeric', month: 'short' });
          savedMeta.textContent = 'Контексти: ' + frameList + ' | ' + timeStr;
          document.getElementById('saved-doc-title').textContent = msg.payload.componentName || 'Збережена документація';
          savedBanner.style.display = 'block';
          genBtn.textContent = '✦ Генерувати заново';
        }
        break;
      case 'no-selection':
        showState('↖', 'Виберіть елемент', 'Клацніть на будь-який шар у Figma');
        break;
      case 'no-components-in-frame':
        showState('◇', 'Компоненти не знайдено', 'На цьому фреймі не знайдено компонентів');
        break;
      case 'error':
        showError(msg.message);
        break;
      case 'all-saved-docs':
        allSavedDocs = msg.payload || [];
        console.log('[all-saved-docs] count=' + allSavedDocs.length + ' stateVisible=' + (state.style.display !== 'none'));
        // If currently on empty state, refresh the list
        if (state.style.display !== 'none') {
          renderSavedDocsList();
        }
        break;
    }
  };

  // ─── Back button ─────────────────────────────────────────────────────────

  backBtn.addEventListener('click', function() {
    if (viewingFromSavedList) {
      viewingFromSavedList = false;
      showState('↖', 'Виберіть елемент', 'Клацніть на будь-який шар у Figma');
    } else if (currentScanData) {
      renderFrameScan(currentScanData);
    }
  });

  // ─── Saved doc buttons ──────────────────────────────────────────────────

  savedShowBtn.addEventListener('click', function() {
    if (pendingSavedDoc && pendingSavedDoc.doc) {
      currentAiDoc = pendingSavedDoc.doc;
      renderAiDoc(pendingSavedDoc.doc);
      copyBtn.disabled = false;
    }
  });

  savedAddBtn.addEventListener('click', function() {
    // "Add context" — generate with previous doc as context
    if (!pendingSavedDoc || !currentFactsData) return;
    genBtn.click(); // triggers generation with previousDoc
  });

  savedResetBtn.addEventListener('click', function() {
    if (!currentFactsData || !currentFactsData.componentName) return;
    parent.postMessage({ pluginMessage: {
      type: 'delete-doc',
      componentName: currentFactsData.componentName,
    }}, '*');
    pendingSavedDoc = null;
    savedBanner.style.display = 'none';
    genBtn.textContent = '✦ Generate Doc';
    aiDocWrap.style.display = 'none';
    currentAiDoc = null;
  });

  // ─── Copy as Markdown ────────────────────────────────────────────────────

  function fieldsToMarkdownTable(fields) {
    var header = '| Властивість | Значення | Джерело |';
    var sep    = '|-------------|----------|---------|';
    var rows   = fields.map(function(f) {
      var srcText = f.source || '—';
      if (srcText.startsWith('токен:')) srcText = '`' + srcText.replace('токен:', '').trim() + '`';
      return '| ' + f.label + ' | ' + f.value + ' | ' + srcText + ' |';
    });
    return [header, sep].concat(rows).join('\n');
  }

  function variantToMarkdown(data) {
    var lines = ['## ' + data.componentSetName];
    var fixedEntries = Object.entries(data.fixedProps);
    if (fixedEntries.length > 0) {
      lines.push('');
      lines.push(fixedEntries.map(function(e) { return '**' + e[0] + '**: ' + e[1]; }).join(' | '));
    }
    if (!data.hasStateProperty) {
      lines.push('');
      lines.push('> _Показано всі variants — властивість стану не визначена_');
    }

    var allLabels = []; var labelSet = {};
    data.variants.forEach(function(v) {
      v.fields.forEach(function(f) {
        if (!labelSet[f.label]) { labelSet[f.label] = true; allLabels.push(f.label); }
      });
    });

    var stateLabels = data.variants.map(function(v) { return v.stateLabel; });
    var fMaps = data.variants.map(function(v) {
      var m = {};
      v.fields.forEach(function(f) { m[f.label] = { value: f.value, source: f.source }; });
      return m;
    });

    lines.push('');
    lines.push('| Властивість | ' + stateLabels.join(' | ') + ' |');
    lines.push('|---' + stateLabels.map(function() { return '|---'; }).join('') + '|');

    allLabels.forEach(function(label) {
      var vals = fMaps.map(function(m) {
        if (!m[label]) return '—';
        var v = m[label].value;
        var s = m[label].source || '';
        if (s.startsWith('токен:')) return v + ' (`' + s.replace('токен:', '').trim() + '`)';
        return v;
      });
      var rawVals = fMaps.map(function(m) { return m[label] ? m[label].value : '—'; });
      var isDiff = rawVals.some(function(v) { return v !== rawVals[0]; });
      var pre = isDiff ? '**' : '';
      var suf = isDiff ? '**' : '';
      lines.push('| ' + pre + label + suf + ' | ' + vals.join(' | ') + ' |');
    });

    return lines.join('\n');
  }

  // ─── AI Doc render ───────────────────────────────────────────────────────

  var AI_SECTIONS = [
    { key: 'usageGuidelines',  title: 'Usage Guidelines' },
    { key: 'contentGuidelines', title: 'Content Guidelines' },
    { key: 'behavior',         title: 'Behavior' },
    { key: 'edgeCases',        title: 'Edge Cases' },
  ];

  function renderAiDoc(data) {
    var sectionsHtml = AI_SECTIONS.map(function(s) {
      var items = (data[s.key] || []).map(function(item) {
        return '<li>' + item + '</li>';
      }).join('');
      return '<div class="ai-doc-section">'
        + '<div class="ai-doc-title">' + s.title + '</div>'
        + '<ul class="ai-doc-list">' + items + '</ul>'
        + '</div>';
    }).join('');

    aiDocWrap.innerHTML = '<div class="ai-doc-header">'
      + '<span class="ai-doc-header-title">AI Documentation</span>'
      + '<span class="ai-doc-badge">✦ Claude</span>'
      + '</div>'
      + '<div class="ai-doc-sections">' + sectionsHtml + '</div>';
    aiDocWrap.style.display = 'block';
  }

  // ─── Generate Doc button ─────────────────────────────────────────────────

  genBtn.addEventListener('click', async function() {
    if (genBtn.disabled || genBtn.classList.contains('loading')) return;

    genBtn.classList.add('loading');
    genBtn.disabled = true;
    genBtn.textContent = 'Генерується…';
    aiDocWrap.style.display = 'none';

    try {
      var body;

      if (currentMode === 'facts' && currentFactsData) {
        // Fact-based generation (multi-selection)
        // Limit data to avoid oversized payloads and timeouts
        var limitedVariants = currentFactsData.variants.slice(0, 10);
        var limitedFacts = currentFactsData.facts.slice(0, 35);
        var limitedContexts = (currentFactsData.usageContexts || []).slice(0, 15);
        body = {
          mode: 'facts',
          componentName: currentFactsData.componentName,
          facts: limitedFacts,
          variants: limitedVariants.map(function(v) {
            return {
              name: v.name,
              variantProperties: v.variantProperties,
              textContent: v.textContent.slice(0, 3),
              hasIcon: v.hasIcon,
            };
          }),
          usageContexts: limitedContexts,
        };

        // If there's a saved doc, include it for incremental generation
        if (pendingSavedDoc && pendingSavedDoc.doc) {
          body.previousDoc = pendingSavedDoc.doc;
          body.previousFrameNames = pendingSavedDoc.frameNames;
        }
      } else {
        // Legacy single/variant mode
        var componentName = nodeNameEl.textContent;
        var componentType = nodeTypeEl.textContent;
        var props = {};

        if (currentMode === 'single' && currentFields) {
          currentFields.forEach(function(f) { props[f.label] = f.value; });
        } else if (currentMode === 'variant' && currentVariantData && currentVariantData.variants.length > 0) {
          currentVariantData.variants[0].fields.forEach(function(f) { props[f.label] = f.value; });
          componentName = currentVariantData.componentSetName;
          componentType = 'COMPONENT_SET';
        } else {
          genBtn.classList.remove('loading');
          genBtn.disabled = false;
          genBtn.textContent = '✦ Generate Doc';
          return;
        }

        body = {
          mode: 'legacy',
          componentName: componentName,
          componentType: componentType,
          properties: props,
        };
      }

      var res = await fetch('https://ai-specs.vercel.app/api/generate-spec', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });

      if (!res.ok) {
        var errData = await res.json().catch(function() { return {}; });
        throw new Error(errData.error || ('HTTP ' + res.status));
      }

      var data = await res.json();
      currentAiDoc = data;
      renderAiDoc(data);
      copyBtn.disabled = false;

      // Save doc to persistent storage
      if (currentMode === 'facts' && currentFactsData && currentFactsData.componentSetId) {
        var prevFrames = (pendingSavedDoc && pendingSavedDoc.frameNames) ? pendingSavedDoc.frameNames : [];
        // Derive current frame names from scan data or usage contexts
        var currentFrameNames = [];
        if (currentScanData && currentScanData.frameNames) {
          currentFrameNames = currentScanData.frameNames;
        }
        // Merge frame names (deduplicate)
        var allFrameNames = prevFrames.slice();
        currentFrameNames.forEach(function(fn) {
          if (allFrameNames.indexOf(fn) === -1) allFrameNames.push(fn);
        });

        parent.postMessage({ pluginMessage: {
          type: 'save-doc',
          savedDoc: {
            componentSetId: currentFactsData.componentSetId,
            componentName: currentFactsData.componentName,
            doc: data,
            frameNames: allFrameNames,
            generatedAt: Date.now(),
          },
        }}, '*');

        pendingSavedDoc = null;
        savedBanner.style.display = 'none';
      }
    } catch (e) {
      aiDocWrap.innerHTML = '<div class="ai-doc-error">⚠ ' + (e.message || 'Помилка генерації') + '</div>';
      aiDocWrap.style.display = 'block';
    }

    genBtn.classList.remove('loading');
    genBtn.disabled = false;
    genBtn.textContent = '✦ Generate Doc';
  });

  // ─── Copy as Markdown ────────────────────────────────────────────────────

  function aiDocToMarkdown(data) {
    return AI_SECTIONS.map(function(s) {
      var items = (data[s.key] || []).map(function(i) { return '- ' + i; }).join('\n');
      return '### ' + s.title + '\n' + items;
    }).join('\n\n');
  }

  copyBtn.addEventListener('click', async function() {
    var md;

    if (currentMode === 'facts' && currentAiDoc) {
      md = '## ' + (currentFactsData ? currentFactsData.componentName : 'Component') + ' Specification\n\n'
        + aiDocToMarkdown(currentAiDoc);
    } else if (currentMode === 'variant' && currentVariantData) {
      md = variantToMarkdown(currentVariantData);
    } else if (currentMode === 'multi' && currentComponents) {
      md = currentComponents.map(function(comp) {
        return '## ' + comp.nodeName + '\n\n' + fieldsToMarkdownTable(comp.fields);
      }).join('\n\n');
    } else if (currentMode === 'single' && currentFields) {
      md = fieldsToMarkdownTable(currentFields);
    } else {
      return;
    }

    if (currentAiDoc) {
      md += '\n\n' + aiDocToMarkdown(currentAiDoc);
    }

    try {
      await navigator.clipboard.writeText(md);
      copyOkMsg.classList.add('show');
      setTimeout(function() { copyOkMsg.classList.remove('show'); }, 2000);
    } catch (e) {
      var ta = document.createElement('textarea');
      ta.value = md;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      copyOkMsg.classList.add('show');
      setTimeout(function() { copyOkMsg.classList.remove('show'); }, 2000);
    }
  });
</script>
</body>
</html>
